# ============================================================
# OpenClash / Mihomo 单 Provider 配置（Sub-Store 组合订阅）
#
# 前置条件：Sub-Store 组合订阅输出链接已从路由器测试 HTTP 200。
# 只使用一个 SubStore Provider；不要求节点名带 [A]/[B] 前缀。
# 以后更换或新增机场，只需在 Sub-Store 组合订阅中管理，OpenClash 不用新增 Provider。
#
# 保留原有服务策略组及地区测速结构，移除按机场名称区分的策略组。
# 加入 Loyalsoldier 外部规则集，并保留 GeoSite/GeoIP 规则作为补充与兜底。
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: warning
ipv6: true
unified-delay: true
tcp-concurrent: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat
  geosite: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat
  mmdb: https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
    QUIC:
      ports:
      - 443
      - 8443
  skip-domain:
  - Mijia Cloud
  - dlg.io.mi.com
  - "+.push.apple.com"
  - "+.googlevideo.com"
  - "+.qq.com"
  - "+.tencent.com"
  - "+.wechat.com"
  - "+.servicewechat.com"
  - "+.gtimg.com"
  - "+.gtimg.cn"
  - "+.qpic.cn"
  - "+.qlogo.cn"
  - "+.tenpay.com"
  - "+.myqcloud.com"
  - "+.qcloud.com"
  - "+.douyin.com"
  - "+.douyincdn.com"
  - "+.douyinpic.com"
  - "+.douyinstatic.com"
  - "+.douyinliving.com"
  - "+.iesdouyin.com"
  - "+.douyinvod.com"
  - "+.douyinvideo.net"
  - "+.amemv.com"
  - "+.snssdk.com"
  - "+.byteimg.com"
  - "+.bytecdn.cn"
  - "+.ibytedtos.com"
  - "+.zijieapi.com"
  - "+.pstatp.com"
  - "+.toutiao.com"
  - "+.toutiaovod.com"
  - "+.bytedance.net"
  - "+.xiaohongshu.com"
  - "+.xhscdn.com"
  - "+.xhscdn.net"
  - "+.xhslink.com"
  - "+.xhsimg.com"
  - "+.taobao.com"
  - "+.tmall.com"
  - "+.tbcdn.cn"
  - "+.alicdn.com"
  - "+.alibaba.com"
  - "+.alibabausercontent.com"
  - "+.alipay.com"
  - "+.alipayobjects.com"
  - "+.goofish.com"
  - "+.idlefish.com"
  - "+.aliyun.com"
  - "+.aliyuncs.com"
  - "+.mmstat.com"
  - "+.cainiao.com"
  - "+.amap.com"
  - "+.autonavi.com"
  - "+.115.com"
  - "+.115cdn.com"
  - "+.115cdn.net"
  - "+.115img.com"
  - "+.116cd.cn"
  - "+.116cd.com"
  - "+.116cd.net"
  - "+.anxia.com"
  - "+.sq.cc"
  - fhnfile.oss-cn-shenzhen.aliyuncs.com
tun:
  enable: false
  stack: mixed
  mtu: 1492
  dns-hijack:
  - any:53
  - tcp://any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true

profile:
  store-selected: true
  store-fake-ip: true

# ---------------- DNS ----------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  cache-algorithm: arc
  ipv6: true
  prefer-ipv6: false
  prefer-h3: false
  use-hosts: true
  use-system-hosts: true
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
  - "*.lan"
  - "*.local"
  - "+.localdomain"
  - localhost.ptlogin2.qq.com
  - "+.qq.com"
  - "+.tencent.com"
  - "+.wechat.com"
  - "+.servicewechat.com"
  - "+.gtimg.com"
  - "+.gtimg.cn"
  - "+.qpic.cn"
  - "+.qlogo.cn"
  - "+.tenpay.com"
  - "+.myqcloud.com"
  - "+.qcloud.com"
  - "+.douyin.com"
  - "+.douyincdn.com"
  - "+.douyinpic.com"
  - "+.douyinstatic.com"
  - "+.douyinliving.com"
  - "+.iesdouyin.com"
  - "+.douyinvod.com"
  - "+.douyinvideo.net"
  - "+.amemv.com"
  - "+.snssdk.com"
  - "+.byteimg.com"
  - "+.bytecdn.cn"
  - "+.ibytedtos.com"
  - "+.zijieapi.com"
  - "+.pstatp.com"
  - "+.toutiao.com"
  - "+.toutiaovod.com"
  - "+.bytedance.net"
  - "+.xiaohongshu.com"
  - "+.xhscdn.com"
  - "+.xhscdn.net"
  - "+.xhslink.com"
  - "+.xhsimg.com"
  - time.windows.com
  - time.apple.com
  - time.android.com
  - "+.xn--ngstr-lra8j.com"
  - "+.ntp.org.cn"
  - "+.pool.ntp.org"
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver-policy:
    "geosite:private,cn,geolocation-cn,apple-cn,microsoft@cn,steam@cn":
    - 223.5.5.5
    - 119.29.29.29
    "geosite:microsoft":
    - 223.5.5.5
    - 119.29.29.29
    "+.speedtest.net":
    - 223.5.5.5
    - 119.29.29.29
    "+.ooklaserver.net":
    - 223.5.5.5
    - 119.29.29.29
    "+.speed.cloudflare.com":
    - 223.5.5.5
    - 119.29.29.29
    "+.measurementlab.net":
    - 223.5.5.5
    - 119.29.29.29
    "geosite:github,google,youtube,telegram,geolocation-!cn":
    - https://1.1.1.1/dns-query#PROXY
    - https://dns.google/dns-query#PROXY

# ---------------- Sub-Store 单一组合订阅 ----------------
proxy-providers:
  SubStore组合订阅:
    type: http
    # 使用已验证返回 HTTP 200 的 Sub-Store 组合订阅链接；无需机场名前缀
    url: "http://192.168.11.1:3002/RArdCYx05FqoorulLZ4vkCoPGc9RFXdA/download/collection/substore?target=ClashMeta"
    interval: 3600
    path: ./providers/substore_combined.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
    override:
      udp: true

# ---------------- 外部规则集（Loyalsoldier） ----------------
rule-providers:
  reject:
    type: http
    behavior: domain
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/loyalsoldier/applications.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400

  ai:
    type: http
    behavior: classical
    format: yaml
    url: https://ddgksf2013.top/filter/Ai.yaml
    path: ./ruleset/loyalsoldier/ai.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./ruleset/loyalsoldier/direct.yaml
