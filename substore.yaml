# ============================================================
# OpenClash / Mihomo 单 Provider 配置（Sub-Store 组合订阅）
#
# 前置条件：Sub-Store 组合订阅输出链接已从路由器测试 HTTP 200。
# 只使用一个 SubStore Provider；不要求节点名带 [A]/[B] 前缀。
# 以后更换或新增机场，只需在 Sub-Store 组合订阅中管理，OpenClash 不用新增 Provider。
#
# 保留原有服务策略组及地区测速结构，移除按机场名称区分的策略组。
# 加入 Loyalsoldier 外部规则集，并保留 GeoSite/GeoIP 规则作为补充与兜底。
# ============================================================

mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true
# 与当前可正常启动的 openclash-pure.yaml 保持一致；不要改成 off
find-process-mode: strict

profile:
  store-selected: true
  store-fake-ip: true

# ---------------- DNS ----------------
dns:
  enable: true
  listen: 0.0.0.0:7874
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# ---------------- Sub-Store 单一组合订阅 ----------------
proxy-providers:
  SubStore组合订阅:
    type: http
    # 使用已验证返回 HTTP 200 的 Sub-Store 组合订阅链接；无需机场名前缀
    url: "http://192.168.11.1:3002/RArdCYx05FqoorulLZ4vkCoPGc9RFXdA/download/collection/substore?target=ClashMeta"
    interval: 3600
    path: ./providers/substore_combined.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
    override:
      udp: true

# ---------------- 外部规则集（Loyalsoldier） ----------------
rule-providers:
  reject:
    type: http
    behavior: domain
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./ruleset/loyalsoldier/reject.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./ruleset/loyalsoldier/private.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt
    path: ./ruleset/loyalsoldier/applications.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt
    path: ./ruleset/loyalsoldier/proxy.yaml
    interval: 86400
      ai:
    type: http
    behavior: classical
    format: yaml
    url: https://ddgksf2013.top/filter/Ai.yaml
    path: ./ruleset/loyalsoldier/ai.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt
    path: ./ruleset/loyalsoldier/direct.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt
    path: ./ruleset/loyalsoldier/gfw.yaml
    interval: 86400
  tld-not-cn:
    type: http
    behavior: domain
    format: text
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/tld-not-cn.txt
    path: ./ruleset/loyalsoldier/tld-not-cn.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt
    path: ./ruleset/loyalsoldier/telegramcidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt
    path: ./ruleset/loyalsoldier/cncidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://fastly.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./ruleset/loyalsoldier/lancidr.yaml
    interval: 86400

# ---------------- 策略组 ----------------
proxy-groups:
  # 主要手动策略组
  - name: Proxy
    type: select
    proxies:
      - 自动选择
      - 故障转移
      - "🇭🇰 香港节点"
      - "🇺🇸 美国节点"
      - "🇯🇵 日本节点"
      - "🇰🇷 韩国节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 新加坡节点"
    # 同时显示组合订阅内所有原始节点，无需 [A]/[B] 前缀
    use: [SubStore组合订阅]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Surge.png

  - name: Apple
    type: select
    proxies: [DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Apple_Arcade.png

  - name: AIGC
    type: select
    proxies: [AI节点, Proxy]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/ChatGPT.png

  - name: Telegram
    type: select
    proxies: [Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Telegram.png

  - name: Netflix
    type: select
    proxies: [Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Netflix.png

  - name: "Disney+"
    type: select
    proxies: [Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Disney.png

  - name: YouTube
    type: select
    proxies: [Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/YouTube.png

  - name: Spotify
    type: select
    proxies: [DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Spotify.png

  - name: TikTok
    type: select
    proxies: ["🇸🇬 新加坡节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/TikTok.png

  - name: BiliBili
    type: select
    proxies: [DIRECT, "🇭🇰 香港节点", "🇹🇼 台湾节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Bilibili.png

  - name: GlobalMedia
    type: select
    proxies: [Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/GlobalMedia.png

  - name: Microsoft
    type: select
    proxies: [DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Windows.png

  - name: Game
    type: select
    proxies: [DIRECT, Proxy, "🇭🇰 香港节点", "🇺🇸 美国节点", "🇯🇵 日本节点", "🇰🇷 韩国节点", "🇸🇬 新加坡节点"]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Game.png

  - name: 广告拦截
    type: select
    proxies: [REJECT]
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Advertising.png

  # 地区节点组：统一从 Sub-Store 组合订阅筛选并测速
  - name: "🇭🇰 香港节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇭🇰|香港|Hong\s?Kong|\bHK\b|\bHKG\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Hong_Kong.png

  - name: "🇺🇸 美国节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇺🇸|美国|United\s?States|\bUSA\b|\bUS\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-United_States.png

  - name: "🇯🇵 日本节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇯🇵|日本|Japan|\bJP\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Japan.png

  - name: "🇰🇷 韩国节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇰🇷|韩国|Korea|\bKR\b|South\s?Korea)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-South_Korea.png

  - name: "🇹🇼 台湾节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇹🇼|台湾|Taiwan|\bTW\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-China.png

  - name: "🇸🇬 新加坡节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(🇸🇬|新加坡|Singapore|\bSG\b)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/Country-Singapore.png

  - name: "AI节点"
    type: url-test
    use: [SubStore组合订阅]
    filter: '(?i)(AI|GPT|ChatGPT|OpenAI|Gemini|Claude|Copilot|LLM)'
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true
    disable-udp: false
    icon: https://raw.githubusercontent.com/Rabbit-Spec/Surge/Master/Conf/icon/AI.png

  # 手动主选择以外的测速/容错选择组
  - name: 自动选择
    type: url-test
    use: [SubStore组合订阅]
    url: https://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    timeout: 5000
    lazy: true
    hidden: true

  - name: 故障转移
    type: fallback
    use: [SubStore组合订阅]
    url: https://www.gstatic.com/generate_204
    interval: 300
    timeout: 5000
    lazy: true
    hidden: true

# ---------------- 分流规则：外部规则集优先，GeoSite/GeoIP 作为补充与兜底 ----------------
rules:
  # 局域网 / 私有域名与 IP
  - GEOSITE,private,DIRECT
  - GEOIP,LAN,DIRECT,no-resolve
  - RULE-SET,private,DIRECT
  - RULE-SET,lancidr,DIRECT,no-resolve

  # 广告：使用独立策略组，可在面板切换 REJECT / DIRECT
  - RULE-SET,reject,广告拦截
  - GEOSITE,category-ads-all,广告拦截

  # 用户希望明确走代理的 GitHub 相关域名
  - DOMAIN-SUFFIX,github.com,Proxy
  - DOMAIN-SUFFIX,githubusercontent.com,Proxy
  - DOMAIN-SUFFIX,githubassets.com,Proxy
  - DOMAIN-SUFFIX,githubapp.com,Proxy
  - DOMAIN-SUFFIX,github.io,Proxy
  - DOMAIN-SUFFIX,ghcr.io,Proxy

  # AI 服务
  - RULE-SET,ai,AIGC
  - GEOSITE,openai,AIGC
  - GEOSITE,anthropic,AIGC
  - GEOSITE,category-ai-!cn,AIGC

  # Apple、微软
  - GEOSITE,apple-cn,Apple
  - GEOSITE,apple,Apple
  - GEOSITE,microsoft,Microsoft

  # Telegram、游戏、流媒体与国内视频
  - GEOSITE,telegram,Telegram
  - RULE-SET,telegramcidr,Telegram,no-resolve
  - GEOSITE,category-games,Game
  - GEOSITE,youtube,YouTube
  - GEOSITE,netflix,Netflix
  - GEOIP,netflix,Netflix,no-resolve
  - GEOSITE,disney,Disney+
  - GEOSITE,spotify,Spotify
  - GEOSITE,tiktok,TikTok
  - GEOSITE,bilibili,BiliBili

  # 直连软件与常见直连域名
  - RULE-SET,applications,DIRECT
  - RULE-SET,direct,DIRECT

  # 外部代理规则：GFWList / 代理域名 / 非中国大陆 TLD
  - RULE-SET,proxy,Proxy
  - RULE-SET,gfw,Proxy
  - RULE-SET,tld-not-cn,Proxy

  # 保留 GeoSite/GeoIP 国内外规则作为补充和兜底
  - GEOSITE,geolocation-!cn,Proxy
  - GEOSITE,cn,DIRECT
  - RULE-SET,cncidr,DIRECT,no-resolve
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,Proxy
